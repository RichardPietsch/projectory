services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: helloapp
      DB_USER: hello
      DB_PASSWORD: hello
    command: sh -c "npm run migrate && npm start"
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: helloapp
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello -d helloapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
