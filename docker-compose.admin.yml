services:
  web:
    build:
      context: https://github.com/RichardPietsch/projectory.git#main
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: helloapp
      DB_USER: projectory_local_user
      DB_PASSWORD: projectory_local_password
      AUTH_LOCAL_DEV: "true"
      AUTH_MODE: hybrid
      AUTH_ALLOW_HEADER_SIMULATION: "true"
      AUTH_DEFAULT_ROLE: admin
      SMTP_PASSWORD_ENCRYPTION_KEY: "example-testing-key-change-me-32-bytes-minimum"
    command: sh -c "npm run migrate && npm start"
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: https://github.com/RichardPietsch/projectory.git#main:db
    environment:
      POSTGRES_DB: helloapp
      POSTGRES_USER: projectory_local_user
      POSTGRES_PASSWORD: projectory_local_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectory_local_user -d helloapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
