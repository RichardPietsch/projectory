services:
  web:
    build:
      context: ${REPO_GIT_URL:?Set REPO_GIT_URL to your git URL with ref, e.g. https://github.com/owner/repo.git#main}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: helloapp
      DB_USER: hello
      DB_PASSWORD: hello
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ${REPO_GIT_URL:?Set REPO_GIT_URL to your git URL with ref, e.g. https://github.com/owner/repo.git#main}:db
    environment:
      POSTGRES_DB: helloapp
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello -d helloapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
