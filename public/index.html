<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projectory</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-7xl p-6">
      <header class="mb-6 rounded-xl border border-slate-800 bg-slate-900 p-5">
        <h1 class="text-2xl font-bold">Projectory</h1>
        <p class="mt-2 text-sm text-slate-300">Administration and ownership views for resource planning.</p>
      </header>

      <nav class="mb-3 flex gap-2" id="main-tabs"></nav>
      <nav class="mb-6 flex gap-2" id="sub-tabs"></nav>
      <p id="flash" class="mb-4 hidden rounded-md border px-3 py-2 text-sm"></p>
      <section id="view"></section>

      <footer class="mt-8 border-t border-slate-800 pt-4 text-sm text-slate-300">
        <div class="flex flex-wrap items-center gap-3">
          <button id="export-btn" class="rounded border border-slate-600 px-3 py-2 hover:bg-slate-900">Export JSON</button>
          <button id="import-btn" class="rounded border border-slate-600 px-3 py-2 hover:bg-slate-900">Import JSON</button>
          <input id="import-file" type="file" accept="application/json" class="hidden" />
        </div>
      </footer>
    </main>

    <script>
      const state = {
        mainTab: 'administration',
        adminTab: 'people',
        selectedProjectId: '',
        meta: { trades: [], levels: [], priorities: [] },
        people: [],
        clients: [],
        projectsPayload: { projects: [], challenges: [], assignments: [] }
      };

      const mainTabs = [
        { id: 'administration', label: 'Administration' },
        { id: 'ownership', label: 'Ownership' }
      ];

      const adminTabs = [
        { id: 'people', label: 'People View' },
        { id: 'clients', label: 'Client View' },
        { id: 'projects', label: 'Project View' }
      ];

      function showMessage(message, type = 'ok') {
        const flash = document.getElementById('flash');
        flash.textContent = message;
        flash.className = `mb-4 rounded-md border px-3 py-2 text-sm ${
          type === 'error'
            ? 'border-rose-500/50 bg-rose-500/10 text-rose-200'
            : 'border-emerald-500/50 bg-emerald-500/10 text-emerald-200'
        }`;
      }

      function formatEuro(cents) {
        return (Number(cents || 0) / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
      }

      async function api(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({ error: 'Request failed.' }));
          throw new Error(data.error || 'Request failed.');
        }

        if (response.status === 204) return null;
        return response.json();
      }

      async function loadData() {
        state.meta = await api('/api/meta');
        state.people = await api('/api/people');
        state.clients = await api('/api/clients');
        state.projectsPayload = await api('/api/projects');

        if (!state.selectedProjectId && state.projectsPayload.projects.length > 0) {
          state.selectedProjectId = String(state.projectsPayload.projects[0].id);
        }
      }

      function optionList(items, selected) {
        return items.map((item) => `<option value="${item.id}" ${String(selected) === String(item.id) ? 'selected' : ''}>${item.name}</option>`).join('');
      }

      function renderMainTabs() {
        const root = document.getElementById('main-tabs');
        root.innerHTML = mainTabs
          .map((tab) => `<button class="rounded-lg border px-4 py-2 text-sm font-semibold ${state.mainTab === tab.id ? 'border-emerald-400 bg-emerald-500/15 text-emerald-200' : 'border-slate-700 bg-slate-900 text-slate-300'}" data-main-tab="${tab.id}">${tab.label}</button>`)
          .join('');

        root.querySelectorAll('button').forEach((button) => {
          button.addEventListener('click', () => {
            state.mainTab = button.dataset.mainTab;
            render();
          });
        });
      }

      function renderSubTabs() {
        const root = document.getElementById('sub-tabs');
        if (state.mainTab !== 'administration') {
          root.innerHTML = '';
          return;
        }

        root.innerHTML = adminTabs
          .map((tab) => `<button class="rounded-lg border px-4 py-2 text-sm font-semibold ${state.adminTab === tab.id ? 'border-emerald-400 bg-emerald-500/15 text-emerald-200' : 'border-slate-700 bg-slate-900 text-slate-300'}" data-admin-tab="${tab.id}">${tab.label}</button>`)
          .join('');

        root.querySelectorAll('button').forEach((button) => {
          button.addEventListener('click', () => {
            state.adminTab = button.dataset.adminTab;
            render();
          });
        });
      }

      function peopleView() {
        const rows = state.people
          .map((person) => `<tr class="border-t border-slate-800"><td class="p-2">${person.first_name} ${person.last_name}</td><td class="p-2">${person.trade_name}</td><td class="p-2">${person.level_name}</td><td class="p-2">${person.assignment_count}</td><td class="p-2"><button class="rounded border border-slate-600 px-2 py-1 text-xs" onclick='editPerson(${JSON.stringify(person)})'>Edit</button> <button class="rounded border border-rose-500/50 px-2 py-1 text-xs text-rose-300" onclick='deletePerson(${person.id})'>Delete</button></td></tr>`)
          .join('');

        return `<div class="grid gap-6 lg:grid-cols-[1fr,2fr]"><form id="person-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">Add / Edit Person</h2><input type="hidden" name="id" /><label class="mb-2 block text-sm">First Name<input required name="firstName" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Last Name<input required name="lastName" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Trade<select required name="tradeId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(state.meta.trades)}</select></label><label class="mb-2 block text-sm">Level<select required name="levelId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(state.meta.levels)}</select></label><button class="mt-3 rounded bg-emerald-600 px-3 py-2 text-sm font-semibold">Save Person</button></form><div class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">People</h2><table class="w-full text-left text-sm"><thead><tr class="text-slate-400"><th class="p-2">Name</th><th class="p-2">Trade</th><th class="p-2">Level</th><th class="p-2">Assignments</th><th class="p-2">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
      }

      function clientsView() {
        const clientRows = state.clients
          .map((client) => `<tr class="border-t border-slate-800"><td class="p-2">${client.name}</td><td class="p-2">${client.location}</td><td class="p-2">${client.since_month}</td><td class="p-2">${client.priority_name}</td><td class="p-2">${client.project_count}</td><td class="p-2"><button class="rounded border border-slate-600 px-2 py-1 text-xs" onclick='editClient(${JSON.stringify(client)})'>Edit</button> <button class="rounded border border-rose-500/50 px-2 py-1 text-xs text-rose-300" onclick='deleteClient(${client.id})'>Delete</button></td></tr>`)
          .join('');

        return `<div class="grid gap-6 lg:grid-cols-2"><form id="client-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">Add / Edit Client</h2><input type="hidden" name="id" /><label class="mb-2 block text-sm">Name<input required name="name" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Location<input required name="location" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Since (yyyy-mm)<input required name="sinceMonth" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Priority<select required name="priorityId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(state.meta.priorities)}</select></label><button class="mt-3 rounded bg-emerald-600 px-3 py-2 text-sm font-semibold">Save Client</button></form><div class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">Clients</h2><table class="w-full text-left text-sm"><thead><tr class="text-slate-400"><th class="p-2">Name</th><th class="p-2">Location</th><th class="p-2">Since</th><th class="p-2">Priority</th><th class="p-2">Projects</th><th class="p-2">Actions</th></tr></thead><tbody>${clientRows}</tbody></table></div></div>`;
      }

      function administrationProjectsView() {
        const projects = state.projectsPayload.projects;
        const projectRows = projects.map((project) => `<tr class="border-t border-slate-800"><td class="p-2">${project.name}<div class="text-xs text-slate-400">${project.client_name}</div></td><td class="p-2">${project.start_month} → ${project.end_month || 'open'}</td><td class="p-2">${formatEuro(project.budget_cents)}</td><td class="p-2"><button class="rounded border border-slate-600 px-2 py-1 text-xs" onclick='editProject(${JSON.stringify(project)})'>Edit</button> <button class="rounded border border-rose-500/50 px-2 py-1 text-xs text-rose-300" onclick='deleteProject(${project.id})'>Delete</button></td></tr>`).join('');

        return `<div class="grid gap-6 lg:grid-cols-[1fr,2fr]"><form id="project-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">Add / Edit Project</h2><input type="hidden" name="id" /><label class="mb-2 block text-sm">Name<input required name="name" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Client<select required name="clientId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(state.clients)}</select></label><label class="mb-2 block text-sm">Start (yyyy-mm)<input required name="startMonth" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">End (yyyy-mm optional)<input name="endMonth" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><label class="mb-2 block text-sm">Budget in EUR<input required name="budgetEuros" type="number" min="0" step="0.01" class="mt-1 w-full rounded bg-slate-950 p-2" /></label><button class="mt-3 rounded bg-emerald-600 px-3 py-2 text-sm font-semibold">Save Project</button></form><div class="rounded-xl border border-slate-800 bg-slate-900 p-4"><h2 class="mb-3 text-lg font-semibold">Projects</h2><table class="w-full text-left text-sm"><thead><tr class="text-slate-400"><th class="p-2">Project</th><th class="p-2">Dates</th><th class="p-2">Budget</th><th class="p-2">Actions</th></tr></thead><tbody>${projectRows}</tbody></table></div></div>`;
      }

      function ownershipView() {
        const projects = state.projectsPayload.projects;

        if (projects.length === 0) {
          return `<div class="rounded-xl border border-slate-800 bg-slate-900 p-6 text-sm text-slate-300">No projects available yet. Create a project under Administration first.</div>`;
        }

        const selectedProjectId = Number(state.selectedProjectId || projects[0].id);
        const selectedProject = projects.find((p) => Number(p.id) === selectedProjectId) || projects[0];
        state.selectedProjectId = String(selectedProject.id);

        const projectChallenges = state.projectsPayload.challenges.filter((challenge) => Number(challenge.project_id) === Number(selectedProject.id));
        const projectAssignments = state.projectsPayload.assignments.filter((assignment) => Number(assignment.project_id) === Number(selectedProject.id));

        const challengeRows = projectChallenges
          .map((challenge) => `<tr class="border-t border-slate-800"><td class="p-2">${challenge.title}</td><td class="p-2">${challenge.description}</td><td class="p-2">${challenge.assignment_count}</td><td class="p-2"><button class="rounded border border-slate-600 px-2 py-1 text-xs" onclick='editChallenge(${JSON.stringify(challenge)})'>Edit</button> <button class="rounded border border-rose-500/50 px-2 py-1 text-xs text-rose-300" onclick='deleteChallenge(${challenge.id})'>Delete</button></td></tr>`)
          .join('');

        const assignmentRows = projectAssignments
          .map((assignment) => `<tr class="border-t border-slate-800"><td class="p-2">${assignment.first_name} ${assignment.last_name}</td><td class="p-2">${assignment.challenge_title}</td><td class="p-2">${Number(assignment.quantity).toFixed(2)}%</td><td class="p-2">${assignment.is_owner ? 'Owner' : assignment.is_leader ? 'Leader' : 'Contributor'}</td><td class="p-2"><button class="rounded border border-slate-600 px-2 py-1 text-xs" onclick='toggleAssignmentRole(${assignment.id}, ${assignment.is_owner}, ${assignment.is_leader})'>Toggle Role</button> <button class="rounded border border-rose-500/50 px-2 py-1 text-xs text-rose-300" onclick='deleteAssignment(${assignment.id})'>Delete</button></td></tr>`)
          .join('');

        return `
          <div class="mb-6 rounded-xl border border-slate-800 bg-slate-900 p-4">
            <label class="block text-sm">Selected Project
              <select id="ownership-project-select" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(projects.map((p) => ({ id: p.id, name: `${p.name} (${p.client_name})` })), selectedProject.id)}</select>
            </label>
          </div>

          <div class="grid gap-6 lg:grid-cols-2">
            <form id="challenge-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 class="mb-3 text-lg font-semibold">Challenge for ${selectedProject.name}</h2>
              <input type="hidden" name="id" />
              <label class="mb-2 block text-sm">Title<input required name="title" class="mt-1 w-full rounded bg-slate-950 p-2" /></label>
              <label class="mb-2 block text-sm">Description<textarea required name="description" class="mt-1 w-full rounded bg-slate-950 p-2"></textarea></label>
              <button class="mt-3 rounded bg-emerald-600 px-3 py-2 text-sm font-semibold">Save Challenge</button>
            </form>

            <form id="assignment-form" class="rounded-xl border border-slate-800 bg-slate-900 p-4">
              <h2 class="mb-3 text-lg font-semibold">Assignment for ${selectedProject.name}</h2>
              <input type="hidden" name="projectId" value="${selectedProject.id}" />
              <label class="mb-2 block text-sm">Challenge<select required name="challengeId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(projectChallenges.map((c) => ({ id: c.id, name: c.title })))}</select></label>
              <label class="mb-2 block text-sm">Person<select required name="personId" class="mt-1 w-full rounded bg-slate-950 p-2">${optionList(state.people.map((p) => ({ id: p.id, name: `${p.first_name} ${p.last_name}` })))}</select></label>
              <label class="mb-2 flex items-center gap-2 text-sm"><input type="checkbox" name="isOwner" /> isOwner</label>
              <label class="mb-2 flex items-center gap-2 text-sm"><input type="checkbox" name="isLeader" /> isLeader</label>
              <button class="mt-3 rounded bg-emerald-600 px-3 py-2 text-sm font-semibold">Create Assignment</button>
            </form>
          </div>

          <div class="mt-6 rounded-xl border border-slate-800 bg-slate-900 p-4">
            <h3 class="mb-3 text-lg font-semibold">Challenges in selected project</h3>
            <table class="w-full text-left text-sm"><thead><tr class="text-slate-400"><th class="p-2">Title</th><th class="p-2">Description</th><th class="p-2">Assignments</th><th class="p-2">Actions</th></tr></thead><tbody>${challengeRows}</tbody></table>
          </div>

          <div class="mt-6 rounded-xl border border-slate-800 bg-slate-900 p-4">
            <h3 class="mb-3 text-lg font-semibold">Assignments in selected project</h3>
            <table class="w-full text-left text-sm"><thead><tr class="text-slate-400"><th class="p-2">Person</th><th class="p-2">Challenge</th><th class="p-2">Quantity</th><th class="p-2">Role</th><th class="p-2">Actions</th></tr></thead><tbody>${assignmentRows}</tbody></table>
          </div>
        `;
      }

      async function handleMutation(action, successMessage) {
        try {
          await action();
          await loadData();
          render();
          showMessage(successMessage);
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      function bindForms() {
        const personForm = document.getElementById('person-form');
        if (personForm) {
          personForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(personForm).entries());
            const id = payload.id;
            delete payload.id;
            await handleMutation(() => api(id ? `/api/people/${id}` : '/api/people', { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }), 'Person saved.');
            personForm.reset();
          });
        }

        const clientForm = document.getElementById('client-form');
        if (clientForm) {
          clientForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(clientForm).entries());
            const id = payload.id;
            delete payload.id;
            await handleMutation(() => api(id ? `/api/clients/${id}` : '/api/clients', { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }), 'Client saved.');
            clientForm.reset();
          });
        }

        const projectForm = document.getElementById('project-form');
        if (projectForm) {
          projectForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(projectForm).entries());
            const id = payload.id;
            delete payload.id;
            await handleMutation(() => api(id ? `/api/projects/${id}` : '/api/projects', { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }), 'Project saved.');
            projectForm.reset();
          });
        }

        const challengeForm = document.getElementById('challenge-form');
        if (challengeForm) {
          challengeForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(challengeForm).entries());
            const id = payload.id;
            if (id) {
              delete payload.id;
              await handleMutation(() => api(`/api/challenges/${id}`, { method: 'PUT', body: JSON.stringify(payload) }), 'Challenge saved.');
            } else {
              delete payload.id;
              await handleMutation(() => api(`/api/projects/${state.selectedProjectId}/challenges`, { method: 'POST', body: JSON.stringify(payload) }), 'Challenge saved.');
            }
            challengeForm.reset();
          });
        }

        const assignmentForm = document.getElementById('assignment-form');
        if (assignmentForm) {
          assignmentForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(assignmentForm).entries());
            payload.isOwner = Boolean(payload.isOwner);
            payload.isLeader = Boolean(payload.isLeader);
            await handleMutation(() => api('/api/assignments', { method: 'POST', body: JSON.stringify(payload) }), 'Assignment created.');
            assignmentForm.reset();
          });
        }

        const projectSelect = document.getElementById('ownership-project-select');
        if (projectSelect) {
          projectSelect.addEventListener('change', () => {
            state.selectedProjectId = projectSelect.value;
            render();
          });
        }
      }

      async function exportData() {
        try {
          const payload = await api('/api/export');
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `projectory-export-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          showMessage('Export completed.');
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      async function importData(file) {
        try {
          const text = await file.text();
          const payload = JSON.parse(text);
          await api('/api/import', { method: 'POST', body: JSON.stringify(payload) });
          await loadData();
          render();
          showMessage('Import completed.');
        } catch (error) {
          showMessage(`Import failed: ${error.message}`, 'error');
        }
      }

      function bindFooterActions() {
        const exportButton = document.getElementById('export-btn');
        const importButton = document.getElementById('import-btn');
        const importInput = document.getElementById('import-file');

        exportButton?.addEventListener('click', exportData);
        importButton?.addEventListener('click', () => importInput?.click());
        importInput?.addEventListener('change', async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          await importData(file);
          importInput.value = '';
        });
      }

      window.editPerson = function editPerson(person) {
        const form = document.getElementById('person-form');
        form.id.value = person.id;
        form.firstName.value = person.first_name;
        form.lastName.value = person.last_name;
        form.tradeId.value = person.trade_id;
        form.levelId.value = person.level_id;
      };

      window.deletePerson = async function deletePerson(id) {
        await handleMutation(() => api(`/api/people/${id}`, { method: 'DELETE' }), 'Person deleted.');
      };

      window.editClient = function editClient(client) {
        const form = document.getElementById('client-form');
        form.id.value = client.id;
        form.name.value = client.name;
        form.location.value = client.location;
        form.sinceMonth.value = client.since_month;
        form.priorityId.value = client.priority_id;
      };

      window.deleteClient = async function deleteClient(id) {
        await handleMutation(() => api(`/api/clients/${id}`, { method: 'DELETE' }), 'Client deleted.');
      };

      window.editProject = function editProject(project) {
        const form = document.getElementById('project-form');
        form.id.value = project.id;
        form.name.value = project.name;
        form.clientId.value = project.client_id;
        form.startMonth.value = project.start_month;
        form.endMonth.value = project.end_month || '';
        form.budgetEuros.value = (Number(project.budget_cents) / 100).toFixed(2);
      };

      window.deleteProject = async function deleteProject(id) {
        await handleMutation(() => api(`/api/projects/${id}`, { method: 'DELETE' }), 'Project deleted.');
      };

      window.editChallenge = function editChallenge(challenge) {
        const form = document.getElementById('challenge-form');
        form.id.value = challenge.id;
        form.title.value = challenge.title;
        form.description.value = challenge.description;
      };

      window.deleteChallenge = async function deleteChallenge(id) {
        await handleMutation(() => api(`/api/challenges/${id}`, { method: 'DELETE' }), 'Challenge deleted.');
      };

      window.deleteAssignment = async function deleteAssignment(id) {
        await handleMutation(() => api(`/api/assignments/${id}`, { method: 'DELETE' }), 'Assignment deleted.');
      };

      window.toggleAssignmentRole = async function toggleAssignmentRole(id, isOwner, isLeader) {
        let next = { isOwner: false, isLeader: false };
        if (!isOwner && !isLeader) next = { isOwner: true, isLeader: false };
        else if (isOwner) next = { isOwner: false, isLeader: true };
        await handleMutation(() => api(`/api/assignments/${id}`, { method: 'PUT', body: JSON.stringify(next) }), 'Assignment role updated.');
      };

      function render() {
        renderMainTabs();
        renderSubTabs();

        const view = document.getElementById('view');
        if (state.mainTab === 'administration') {
          if (state.adminTab === 'people') view.innerHTML = peopleView();
          else if (state.adminTab === 'clients') view.innerHTML = clientsView();
          else view.innerHTML = administrationProjectsView();
        } else {
          view.innerHTML = ownershipView();
        }

        bindForms();
      }

      async function init() {
        try {
          await loadData();
          render();
          bindFooterActions();
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      init();
    </script>
  </body>
</html>
